# config/delivery.conf - §11.4.297(A) pull-request delivery declaration of Helix Reader (key HRD).
# DATA per §11.4.35: ONE tracked file. Format: key=value, '#' starts a comment, lists are comma-separated
# (the format read by submodules/constitution/scripts/gates/cm_pr_delivery_account_name_free.sh and by
# scripts/pr/deliver.py). An unknown key or a value outside its closed set makes scripts/pr/deliver.py refuse.
#
# Recorded operator decision (§11.4.66), id PRD-2026-11-23-1, given in-session 2026-11-23, verbatim:
#   "switch to PR driven work -> you create PRs, you do review by independent agents spawned, and you merge PRs into the main!"
# It stands together with the operator's earlier mandate of 2026-11-16 (canon §11.4.297(D)(6), verbatim):
#   "All PRs are ALWAYS created, reviewed and merged by YOU and assigned to main repo owner's account / nick !!!"
# The independent source-correctness GO (§11.4.142/.209/.235, producer != verifier) is produced by spawned review
# agents and remains merge condition (a); the author's self-review is never the GO.
# Status words (§11.4.297(G)): this file is a declaration. The tool that reads it (scripts/pr/deliver.py) is
# PROVISIONAL (hermetic tests against a stub only). Platform protection of main: UNCONFIRMED.

decision_id=PRD-2026-11-23-1
decision_date=2026-11-23
decision_id_round2=PRD-2026-11-16-OPERATOR-MANDATE

# Closed set: direct | pr
mode=pr
base=main

# The GitHub-only remote. NOT 'origin': origin has two push URLs (GitHub + m3w), so a task-branch push through it
# would land the branch on the mirror too and widen retirement (§11.4.297(C)(4)).
pr_remote=github
pr_repository=HelixDevelopment/reader
# Declared upstreams read for parity (ls-remote) and retirement. The mirror is fast-forwarded only after the merge,
# through the sanctioned path (§2.1), never force.
mirror_remotes=m3w

branch_prefix=task

# Author-only reviewer list (§11.4.297(D)(6)): the account that opens the PRs is the only listed account.
# Closed set: report-and-merge | report-and-stop.
author_only_reviewer_policy=report-and-merge
pr_reviewers=milos85vasic
pr_assignees=milos85vasic

# Closed set: ff-only | merge-commit. GitHub offers merge commits natively; squash and rebase are FORBIDDEN.
landing_form=merge-commit
# Closed set: author-agent | human
merger=author-agent

# Plain id syntax of the Roadmap-Item trailer (§11.4.293(A)(3)): a Python regular expression for ONE id.
roadmap_item_pattern=HRD-[0-9]{3,}
multi_task_reason_field=Multi-Task-Reason

protected_branches=main
# Closed set: off | expected | enforced. 'expected' = warn and write an audit line. The local guard that would
# do this is NOT installed yet: UNCONFIRMED until read back (§11.4.297(G)).
direct_push_guard=expected

# Shared single files: PRs changing one of these land one at a time (§11.4.297(B)(5)).
shared_single_files=docs/workable_items.db,docs/Issues.md,docs/Issues_Summary.md,docs/Fixed.md,docs/Fixed_Summary.md,docs/claim_reality_ledger.tsv,docs/evidence/gate_evidence_manifest.tsv,README.md,EVIDENCE.md,CLAUDE.md,AGENTS.md,QWEN.md,GEMINI.md,helix-deps.yaml

# Tool-written ledger paths (§11.4.297(E)(3)): written by scripts/workable_items.py, never by hand.
tool_written_paths=docs/workable_items.db,docs/Issues.md,docs/Issues.html,docs/Issues.pdf,docs/Issues_Summary.md,docs/Issues_Summary.html,docs/Issues_Summary.pdf,docs/Fixed.md,docs/Fixed.html,docs/Fixed.pdf,docs/Fixed_Summary.md,docs/Fixed_Summary.html,docs/Fixed_Summary.pdf,docs/tracking/helixtrack-outbox.json

evidence_dir=evidence
merge_window_hours=24

# Where the independent GO record lives (§11.4.297(C)): a PR comment naming the reviewed head sha, read back before
# the merge, plus a local record file written by `deliver.py review-record`; never committed into the task branch
# (a commit would move the reviewed head).
go_record_location=pr-comment

own_repositories=.:HelixDevelopment/reader:pr
